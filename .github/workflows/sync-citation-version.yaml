name: Sync CITATION.cff version

on:
  push:
    branches: [main]
    paths:
      - DESCRIPTION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync version from DESCRIPTION
        shell: bash
        run: |
          version=$(sed -n 's/^Version: //p' DESCRIPTION)
          if [ -z "$version" ]; then
            echo "Could not read Version from DESCRIPTION"
            exit 1
          fi
          sed -i -E "s/^version: .*/version: ${version}/" CITATION.cff

      - name: Commit updated CITATION.cff
        shell: bash
        run: |
          if git diff --quiet -- CITATION.cff; then
            echo "CITATION.cff is already in sync."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CITATION.cff
          git commit -m "Sync CITATION.cff version with DESCRIPTION"
          git push
